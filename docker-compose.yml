services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: bhoomi
      POSTGRES_PASSWORD: bhoomi
      POSTGRES_DB: bhoomi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhoomi"]
      interval: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://bhoomi:bhoomi@postgres:5432/bhoomi
      JWT_SECRET: change-me-super-secret-jwt-key-demo-only
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
